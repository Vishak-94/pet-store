<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Item</title></head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<p><button type="button" onclick="history.back()">&larr; Back</button></p>
<div th:if="${item == null}"><em>Item not found.</em></div>
<div th:if="${item != null}">
    <h1 th:text="${item.itemId}">itemId</h1>
    <p><strong>Product:</strong> <span th:text="${item.productName}">product</span></p>
    <p><strong>Description:</strong> <span th:text="${item.description}">desc</span></p>
    <p><strong>Attribute:</strong> <span th:text="${item.attribute}">attr</span></p>
    <p><strong>List price:</strong> <span th:text="${#numbers.formatCurrency(item.listCost)}">$0.00</span></p>
    <p>Cart quantity:
        <span th:replace="~{fragments/stepper :: stepper(${item.itemId}, ${itemQty})}">stepper</span>
    </p>
</div>
<div th:replace="~{fragments/stepper :: script}"></div>
</body>
</html>
