<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Something went wrong — Pet Store</title></head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<h1>Sorry — that didn't work</h1>
<p>
    <strong th:text="${status} ?: 500">500</strong>
    <span th:text="${error} ?: 'server_error'">server_error</span>
</p>
<p th:if="${message != null and !message.isEmpty()}" th:text="${message}">Details.</p>
<p><a th:href="@{/}">Back to the store</a></p>
</body>
</html>
