<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Cart</title></head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<h1>Shopping Cart (<span th:text="${count}">0</span> items)</h1>
<table border="1" cellpadding="4">
    <thead><tr><th>Item</th><th>Name</th><th>Qty</th><th>Price</th><th>Total</th><th></th></tr></thead>
    <tbody>
    <tr th:each="i : ${items}">
        <td th:text="${i.itemId}">id</td>
        <td th:text="${i.productName}">name</td>
        <td>
            <form th:action="@{/cart/update}" method="post" style="display:inline">
                <input type="hidden" name="itemId" th:value="${i.itemId}"/>
                <input type="number" name="qty" th:value="${i.quantity}" size="3"/>
                <button type="submit">Update</button>
            </form>
        </td>
        <td th:text="${#numbers.formatCurrency(i.unitCost)}">$0.00</td>
        <td th:text="${#numbers.formatCurrency(i.totalCost)}">$0.00</td>
        <td>
            <form th:action="@{/cart/delete}" method="post" style="display:inline">
                <input type="hidden" name="itemId" th:value="${i.itemId}"/>
                <button type="submit">Remove</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(items)}"><td colspan="6"><em>Your cart is empty.</em></td></tr>
    </tbody>
    <tfoot><tr><td colspan="4"><strong>Subtotal</strong></td><td colspan="2" th:text="${#numbers.formatCurrency(subtotal)}">$0.00</td></tr></tfoot>
</table>
<p th:unless="${#lists.isEmpty(items)}">
    <a th:href="@{/checkout}"><button>Proceed to Checkout</button></a>
</p>
</body>
</html>
