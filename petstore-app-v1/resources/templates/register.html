<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Register — Pet Store</title></head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<h1>Create an Account</h1>
<p th:if="${error}" style="color:red" th:text="${error}">error</p>
<form th:action="@{/register-form}" method="post">
    <!-- Return the user to the originating screen after account creation (legacy behaviour). -->
    <input type="hidden" name="returnUrl" th:if="${returnUrl}" th:value="${returnUrl}"/>
    <h3>Login</h3>
    <p><label>Username* <input type="text" name="userName" th:value="${userName}" required/></label></p>
    <p><label>Password* <input type="password" name="password" required/></label></p>
    <h3>Contact &amp; Address</h3>
    <p><label>First name* <input type="text" name="givenName" th:value="${givenName}" required/></label>
       <label>Last name* <input type="text" name="familyName" th:value="${familyName}" required/></label></p>
    <p><label>Email <input type="text" name="email" th:value="${email}"/></label>
       <label>Telephone* <input type="text" name="telephone" th:value="${telephone}" required/></label></p>
    <p><label>Street* <input type="text" name="street1" th:value="${street1}" required/></label></p>
    <p><label>City* <input type="text" name="city" th:value="${city}" required/></label>
       <label>State* <input type="text" name="state" th:value="${state}" required/></label>
       <label>Zip* <input type="text" name="zipCode" th:value="${zipCode}" required/></label>
       <label>Country <input type="text" name="country" th:value="${country}"/></label></p>
    <h3>Credit Card</h3>
    <p><label>Number* <input type="text" name="cardNumber" th:value="${cardNumber}" required/></label>
       <label>Type* <input type="text" name="cardType" th:value="${cardType}" required/></label>
       <label>Expiry* <input type="text" name="cardExpiry" th:value="${cardExpiry}" placeholder="MM/YY" required/></label></p>
    <p><button type="submit">Register</button></p>
</form>
</body>
</html>
