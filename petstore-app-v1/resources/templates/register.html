<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Register — Pet Store</title></head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<h1>Create an Account</h1>
<p th:if="${error}" style="color:red" th:text="${error}">error</p>
<form th:action="@{/register-form}" method="post">
    <!-- Return the user to the originating screen after account creation (legacy behaviour). -->
    <input type="hidden" name="returnUrl" th:if="${returnUrl}" th:value="${returnUrl}"/>
    <h3>Login</h3>
    <p><label>Username* <input type="text" name="userName" required/></label></p>
    <p><label>Password* <input type="password" name="password" required/></label></p>
    <h3>Contact &amp; Address</h3>
    <p><label>First name <input type="text" name="givenName"/></label>
       <label>Last name <input type="text" name="familyName"/></label></p>
    <p><label>Email <input type="text" name="email"/></label></p>
    <p><label>Street <input type="text" name="street1"/></label></p>
    <p><label>City <input type="text" name="city"/></label>
       <label>State <input type="text" name="state"/></label>
       <label>Zip <input type="text" name="zipCode"/></label>
       <label>Country <input type="text" name="country"/></label></p>
    <h3>Credit Card (optional)</h3>
    <p><label>Number <input type="text" name="cardNumber"/></label>
       <label>Type <input type="text" name="cardType"/></label>
       <label>Expiry <input type="text" name="cardExpiry" placeholder="MM/YY"/></label></p>
    <p><button type="submit">Register</button></p>
</form>
</body>
</html>
