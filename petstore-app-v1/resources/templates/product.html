<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Product</title></head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<p><button type="button" onclick="history.back()">&larr; Back</button></p>
<h1 th:text="${product != null ? product.name : 'Product'}">Product</h1>
<p th:if="${product != null}" th:text="${product.description}">desc</p>
<h2>Items</h2>
<table border="1" cellpadding="4">
    <thead><tr><th>Item</th><th>Description</th><th>Price</th><th>Cart</th></tr></thead>
    <tbody>
    <tr th:each="i : ${items}">
        <td><a th:href="@{/item(id=${i.itemId})}" th:text="${i.itemId}">id</a></td>
        <td th:text="${i.description}">desc</td>
        <td th:text="${i.listCost}">0.0</td>
        <td><span th:replace="~{fragments/stepper :: stepper(${i.itemId}, ${cartQty.get(i.itemId)})}">stepper</span></td>
    </tr>
    <tr th:if="${#lists.isEmpty(items)}"><td colspan="4"><em>No items.</em></td></tr>
    </tbody>
</table>
<div th:replace="~{fragments/stepper :: script}"></div>
</body>
</html>
