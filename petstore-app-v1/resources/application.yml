spring:
  application:
    name: petstore-app-v1

  # In-memory H2 (replaces Cloudscape). Schema created from schema.sql, seeded from data.sql.
  datasource:
    url: jdbc:h2:mem:petstore;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: none          # schema is created by schema.sql (mirrors legacy DDL exactly)
    show-sql: false

  sql:
    init:
      mode: always            # run schema.sql + data.sql on startup

  h2:
    console:
      enabled: true

  # Embedded ActiveMQ Artemis broker — JMS is preserved (queues + InvoiceTopic).
  # Wired now so later phases (order/fulfilment) plug in without config changes.
  artemis:
    # Embedded broker that ALSO listens on tcp://localhost:61616 so admin-office-service
    # can connect to the same broker (shared queue across services).
    mode: embedded
    broker-url: tcp://localhost:61616
    embedded:
      enabled: true
      persistent: false

server:
  port: 8080

# Downstream microservice endpoints — no hardcoded URLs in code.
# Bound to ServiceEndpoints (@ConfigurationProperties). Override per env/profile.
services:
  customer:
    base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
    endpoints:
      register: /register
      login: /auth/login
      customer: /customer/{id}
      account: /customer/{id}/account
      profile: /customer/{id}/profile
      card: /customer/{id}/card
  # Catalog browse is delegated to catalog-service; paths live in the SDK, only
  # the base URL is config here.
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8083}
  # Login is delegated to auth-service (central IdP); auth-client holds the path.
  auth:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8086}

# Cart runs IN-PROCESS via the embeddable cart library (no standalone server).
# In-memory carts with a sliding TTL — a session-timeout analog.
cart:
  ttl-minutes: 15
  sweep-interval-seconds: 60

logging:
  level:
    com.petstore: INFO
