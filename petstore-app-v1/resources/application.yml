spring:
  application:
    name: petstore-app-v1

  # No database — the storefront persists nothing (legacy model): it builds the
  # order and publishes it; order-processing-service is the authoritative store.

  # ActiveMQ Artemis — JMS is preserved (queues + InvoiceTopic). The broker now runs
  # as a STANDALONE container (see repo docker-compose.yml), externalized out of this
  # JVM. The storefront is a plain client of it, exactly like the other services; it
  # no longer hosts the broker. (Tests override this back to an embedded in-VM broker
  # via test/resources/application.yml so `mvn test` needs no running container.)
  artemis:
    mode: native
    broker-url: ${BROKER_URL:tcp://localhost:61616}
    # CRITICAL: `mode: native` only picks the connection factory (connect to broker-url).
    # The embedded broker SERVER is a separate switch that defaults to TRUE whenever
    # artemis-jakarta-server is on the classpath — so it must be turned OFF explicitly,
    # otherwise the storefront would ALSO boot an in-VM broker and never use the container.
    embedded:
      enabled: false

server:
  port: 8080

# Downstream microservice endpoints — no hardcoded URLs in code.
# Bound to ServiceEndpoints (@ConfigurationProperties). Override per env/profile.
services:
  customer:
    base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
    endpoints:
      register: /register
      login: /auth/login
      customer: /customer/{id}
      account: /customer/{id}/account
      profile: /customer/{id}/profile
      card: /customer/{id}/card
  # Catalog browse is delegated to catalog-service; paths live in the SDK, only
  # the base URL is config here.
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8083}
  # Login is delegated to auth-service (central IdP); auth-client holds the path.
  auth:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8086}
  # Checkout places the order via a SYNCHRONOUS call to order-processing-service (OPC)
  # /api/orders/intake (see DECISIONS.md). Only the base URL is config; the intake path
  # lives in the order-processing-client SDK.
  order-processing:
    base-url: ${ORDER_PROCESSING_SERVICE_URL:http://localhost:8088}
  # The item page composes a live stock badge from inventory-service's public per-item
  # availability read (GET /api/inventory/{itemId}/availability). Cosmetic + degradable:
  # a slow/down inventory-service just hides the badge, never blocks browsing.
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8085}

# Health / readiness probes + metrics (Spring Boot Actuator). Matches the other
# services; keep the exposed set minimal (no env/beans/heapdump on the public port).
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Cart runs IN-PROCESS via the embeddable cart library (no standalone server).
# In-memory carts with a sliding TTL — a session-timeout analog.
cart:
  ttl-minutes: 15
  sweep-interval-seconds: 60

logging:
  level:
    com.petstore: INFO
