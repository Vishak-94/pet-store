spring:
  application:
    name: inventory-service
  datasource:
    # File-based H2 so inventory stock levels SURVIVE restarts (was jdbc:h2:mem, wiped on
    # shutdown). AUTO_SERVER lets the H2 console / a second JVM attach to the same file.
    # data.sql uses idempotent MERGE, so re-seeding a populated file DB is safe. Path is
    # overridable per env via INVENTORY_DB_PATH.
    url: jdbc:h2:file:${INVENTORY_DB_PATH:./data/inventory};AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  sql:
    init:
      mode: always
  h2:
    console:
      # Off by default — the console exposes arbitrary SQL over the inventory table with no
      # auth. Enabled only under the 'dev' profile (see application-dev.yml). NEVER enable
      # in a shared/prod environment.
      enabled: false
  # Connect to the SHARED broker hosted by the monolith (tcp://localhost:61616).
  # Consumes ApprovedOrderQueue, publishes InvoiceQueue.
  artemis:
    mode: native
    broker-url: tcp://localhost:61616

server:
  port: 8085

# Central IdP: inventory-service delegates login to auth-service and verifies its
# RS256 tokens with the bundled public key (auth-client). Holds no credentials.
services:
  auth:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.petstore: INFO
