<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Warehouse — Pending Orders</title></head>
<body>
<div style="background:#eee;padding:8px;border-bottom:2px solid #B23A48">
    <b>Warehouse (Admin)</b> &nbsp;|&nbsp;
    <a th:href="@{/warehouse/orders}">Pending Approval</a> &nbsp;|&nbsp;
    <a th:href="@{/warehouse/orders/all}">All Orders</a>
    <span style="float:right">
        <form th:action="@{/warehouse/logout}" method="post" style="display:inline">
            <button type="submit">Sign Off</button>
        </form>
    </span>
</div>
<h1>Pending Order Approval</h1>
<table border="1" cellpadding="6">
    <thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Lines</th><th>Action</th></tr></thead>
    <tbody>
    <tr th:each="o : ${pending}">
        <td th:text="${o.orderId}">id</td>
        <td th:text="${o.user}">user</td>
        <td th:text="${o.total}">0.0</td>
        <td th:text="${o.lines}">0</td>
        <td>
            <form th:action="@{'/warehouse/orders/' + ${o.orderId} + '/approve'}" method="post" style="display:inline">
                <button type="submit">Approve</button>
            </form>
            <form th:action="@{'/warehouse/orders/' + ${o.orderId} + '/deny'}" method="post" style="display:inline">
                <button type="submit">Deny</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(pending)}"><td colspan="5"><em>No orders awaiting approval.</em></td></tr>
    </tbody>
</table>
</body>
</html>
