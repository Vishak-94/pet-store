spring:
  application:
    name: admin-office-service
  # No database, no JMS — the admin console owns no order data. It calls
  # order-processing-service (the OPC) over HTTP and verifies auth-service tokens.

server:
  port: 8082

services:
  # Login delegated to the central IdP; tokens verified via auth-client public key.
  auth:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8086}
  # The Order Processing Center facade this console delegates to.
  opc:
    base-url: ${OPC_SERVICE_URL:http://localhost:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.petstore: INFO
