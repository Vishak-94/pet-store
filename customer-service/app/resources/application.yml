spring:
  application:
    name: customer-service
  datasource:
    # File-based H2 so customer PII/profile data SURVIVES restarts (was jdbc:h2:mem, wiped
    # on shutdown). AUTO_SERVER lets the H2 console / a second JVM attach to the same file.
    # data.sql uses idempotent MERGE, so re-seeding a populated file DB is safe. Path is
    # overridable per env via CUSTOMER_DB_PATH.
    url: jdbc:h2:file:${CUSTOMER_DB_PATH:./data/customer};AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none          # schema from schema.sql
    show-sql: false
  sql:
    init:
      mode: always
  h2:
    console:
      # Off by default — the console exposes arbitrary SQL over the PII/card table with no
      # auth. Enabled only under the 'dev' profile (see application-dev.yml). NEVER enable
      # in a shared/prod environment.
      enabled: false

server:
  port: 8081                  # distinct from the monolith (8080)

# Central IdP: customer-service verifies auth-service RS256 tokens (bundled public
# key) and provisions credentials there at registration. It issues no tokens.
services:
  auth:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8086}
    ttl-seconds: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.petstore: INFO
  # Structured pattern including the correlation id from MDC (see CorrelationIdFilter).
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [cid=%X{correlationId:-}] %logger{36} - %msg%n"
