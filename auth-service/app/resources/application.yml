spring:
  application:
    name: auth-service
  datasource:
    # File-based H2 so credentials/accounts SURVIVE restarts (was jdbc:h2:mem, wiped on
    # shutdown). AUTO_SERVER lets the H2 console / a second JVM attach to the same file.
    # data.sql uses idempotent MERGE, so re-seeding a populated file DB is safe. Path is
    # overridable per env via AUTH_DB_PATH.
    url: jdbc:h2:file:${AUTH_DB_PATH:./data/auth};AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  sql:
    init:
      mode: always

server:
  port: 8086

# RS256: auth-service holds the PRIVATE key (mints tokens). Verifiers hold only
# the public key (bundled in auth-client). Never expose the private key.
auth:
  jwt:
    private-key: classpath:auth-private-key.pem
    ttl-seconds: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.petstore: INFO
